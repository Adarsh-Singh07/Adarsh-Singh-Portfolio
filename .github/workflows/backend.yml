name: Deploy Backend to Google Cloud Run

# Production backend (api.adarshsingh.in) runs on Cloud Run service `portfolio-backend`
# (project portfolio2049, us-central1). Pushes to main with backend changes auto-deploy.
# Existing service config (env vars, GCS volume mount, traffic) is preserved —
# only the container image is rebuilt and rolled out.

on:
  push:
    branches: [ main ]
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy-backend:
    name: Deploy Backend to Cloud Run
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}

      - name: Deploy to Cloud Run (portfolio-backend)
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: portfolio-backend
          region: us-central1
          source: backend/
          project_id: ${{ secrets.GCP_PROJECT_ID }}

