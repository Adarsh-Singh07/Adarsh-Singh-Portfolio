name: Verify & Deploy Frontend to Firebase (Staging only)

# Firebase Hosting deploys ONLY the staging branch -> portfolio-staging target.
# Production frontend (main branch, adarshsingh.in) is NOT auto-deployed;
# ship it manually via deploy_prod.ps1 or the workflow_dispatch below.

on:
  push:
    branches: [ staging ]
    paths:
      - 'frontend/**'
      - 'firebase.json'
      - '.github/workflows/frontend.yml'
  pull_request:
    branches: [ main, staging ]
    paths:
      - 'frontend/**'
  workflow_dispatch:
    inputs:
      target:
        description: 'Firebase hosting target to deploy'
        required: true
        default: 'portfolio-staging'
        type: choice
        options:
          - portfolio-staging
          - portfolio-main

permissions:
  id-token: write
  contents: read

jobs:
  validate-and-deploy:
    name: Verify and Deploy Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Verify Frontend Code (Lint & Build)
        run: |
          cd frontend
          npm run lint
          npm run build

      - name: Deploy Frontend to Firebase Hosting
        # Auto-deploy ONLY on pushes to staging (never on main).
        # Manual runs (workflow_dispatch) can target staging or production.
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            TARGET="portfolio-staging"
          else
            TARGET="${{ github.event.inputs.target }}"
          fi
          echo "Deploying to Firebase hosting target: $TARGET"
          npx firebase-tools deploy --only hosting:$TARGET --token "${{ secrets.FIREBASE_TOKEN }}" --project portfolio2049
